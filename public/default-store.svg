<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d7237" />
      <stop offset="100%" stop-color="#1f4825" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)" />
  <rect x="2" y="2" width="396" height="296" rx="14" fill="none" stroke="#b58e58" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  
  <g transform="translate(136, 50)">
    <!-- Awning / Roof -->
    <path d="M0 50 L128 50 L118 20 L10 20 Z" fill="url(#roof-grad)" opacity="0.95" />
    <path d="M0 50 Q16 62 32 50 Q48 62 64 50 Q80 62 96 50 Q112 62 128 50 L128 44 L0 44 Z" fill="#17361c" />
    
    <!-- Building Body -->
    <rect x="14" y="50" width="100" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="4" />
    
    <!-- Door -->
    <rect x="50" y="82" width="28" height="48" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="56" cy="106" r="2.5" fill="#64748b" />
    
    <!-- Window Left -->
    <rect x="24" y="65" width="20" height="24" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" />
    <line x1="34" y1="65" x2="34" y2="89" stroke="#86efac" stroke-width="1.5" />
    
    <!-- Window Right -->
    <rect x="84" y="65" width="20" height="24" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" />
    <line x1="94" y1="65" x2="94" y2="89" stroke="#86efac" stroke-width="1.5" />
  </g>
  
  <!-- Text Label -->
  <text x="200" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#33412a">Foto Belum Tersedia</text>
  <text x="200" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Dokumentasi tempat usaha / produk</text>
</svg>
